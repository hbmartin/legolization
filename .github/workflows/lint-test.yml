name: Lint and Test
on: push

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Create uv environment
      run: uv venv
    - name: Verify matrix Python
      env:
        EXPECTED_PYTHON: ${{ matrix.python-version }}
      run: >-
        uv run --no-sync python -c
        'import os, sys;
        actual = f"{sys.version_info.major}.{sys.version_info.minor}";
        expected = os.environ["EXPECTED_PYTHON"];
        assert actual == expected, f"expected Python {expected}, got {actual}"'
    - name: Install dependencies
      run: uv sync --all-groups
    - name: Cache LDraw parts library
      id: ldraw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/pyldraw3
        key: pyldraw3-${{ runner.os }}
    - name: Generate ldraw.library part/colour modules
      if: steps.ldraw-cache.outputs.cache-hit != 'true'
      run: |
        uv run ldraw download --yes
        uv run ldraw generate --yes
    - run: uv run ruff format --check .
    - run: uv run ruff check .
    - name: Run type checks
      run: |
        uv run ty check src tests
        uv run pyrefly check src tests
    - name: Run complexity checks
      run: >-
        uv run lizard --languages python --CCN 15 --length 120 --arguments 8
        src/legolization
    - run: uv run deptry .
    - name: Run tests with coverage
      run: uv run pytest --run-slow --cov=legolization --cov-report=lcov --cov-report=html
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload coverage report as artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report-python-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30
