# External validation dataset registry, read by scripts/fetch_datasets.py.
#
# This file is the committed source of truth for WHAT we fetch and under WHAT
# terms. Content hashes live in the generated companion
# `scripts/datasets.lock.toml`, written on first successful fetch and committed
# alongside it — registry plus lock, so a re-fetch is verified rather than
# trusted.
#
# Payloads land under `datasets/` (a symlink here; gitignored) and are never
# vendored. The one exception is `references/bricknet-data/`, four small
# attribution-carrying reference tables copied out of the MIT `bricknet` wheel.
#
# `bytes` is the measured Content-Length recorded when the entry was added; it
# drives `--dry-run` and is a sanity check, not an integrity check — that is the
# lock's job. A changed size on a pinned entry is reported, never silently
# accepted.
#
# Groups:
#   core   - small, fetched by default
#   large  - multi-gigabyte; opt in with --group large
#   manual - acquired outside this script (licence gate, or already in flight)
#
# SCOPE: this registry covers voxel and brick data only. Pure-geometry mesh
# corpora (Thingi10K, ShapeNetCore) and non-brick stacking benchmarks
# (ShapeStacks) are deliberately out of the current programme and are recorded
# as speculative follow-up work at the end of ROADMAP.md. COMPAS CRA is the one
# non-brick source kept, because it is the only independent check on the
# equilibrium formulation itself.
#
# Provenance and licence analysis: docs/reports/dataset-survey.md
# Programme rationale: ROADMAP.md, "External validation datasets"

# --- core ----------------------------------------------------------------

[[dataset]]
name = "stabletext2brick"
group = "core"
license = "MIT"
source = "https://huggingface.co/datasets/AvaLovelace/StableText2Lego"
citation = "Pun et al., Generating Physically Stable and Buildable LEGO Designs from Text, ICCV 2025 (arXiv:2505.05469)"
notes = """
47,389 brick structures on a 20x20x20 grid with per-voxel stability scores and
captions. Every row passed the StableLego analyser during construction, so the
whole set is a positive-only stability regression. BrickSim's headline
150-assembly evaluation is sampled from exactly this dataset
(references/bricksim-*/paper.md:194), so our 150-sample figure is comparable.
"""

