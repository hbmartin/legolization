[[dataset]]
name = "craft3d"
group = "large"
license = "MIT (facebookresearch/craftassist)"
source = "https://github.com/facebookresearch/craftassist"
citation = "Chen et al., Order-Aware Generative Modeling Using the 3D-Craft Dataset, ICCV 2019"
extract = "tar"
notes = """
2,586 crowd-built Minecraft houses recorded as timestamped
[timestamp, user_id, x, y, z, block_id, place/break] sequences over 253 block
ids. Two independent uses: large multi-colour voxel inputs for the colour
constraint path (letter-h-bicolour is our only colour fixture, with 2 colours),
and HUMAN BUILD ORDER as an external reference for the instruction sequencer.
MEPNet used this same house set for the ordering signal.
"""

[[dataset.file]]
name = "house_data.tar.gz"
url = "https://craftassist.s3-us-west-2.amazonaws.com/pubr/house_data.tar.gz"
bytes = 562_618_483

[[dataset.file]]
name = "instance_segmentation_data.tar.gz"
url = "https://craftassist.s3-us-west-2.amazonaws.com/pubr/instance_segmentation_data.tar.gz"
bytes = 1_987_127

[[dataset]]
name = "mobilebrick"
group = "manual"
license = "MIT"
source = "https://github.com/ActiveVisionLab/MobileBrick"
citation = "Li et al., MobileBrick: Building LEGO for 3D Reconstruction on Mobile Devices, CVPR 2023 (arXiv:2303.01932)"
notes = """
ACQUIRED OUT OF BAND — the zip is 13.1 GB and already downloading to
datasets/MobileBrick_Mar23.zip.

153 sequences: 135 random brick shapes and 18 manually curated LEGO models, each
with a mesh/gt_mesh.ply ground-truth shape derived from known brick geometry.
The rest of the archive is RGBD imagery we do not need.

EXTRACT SELECTIVELY — never unpack the whole archive:
    unzip -j datasets/MobileBrick_Mar23.zip '*/mesh/*.ply' \\
        -d datasets/mobilebrick/meshes/
That is ~300 MB rather than ~13 GB. `scripts/fetch_datasets.py --only
mobilebrick` performs exactly this extraction against the existing zip.
"""

[[dataset.file]]
name = "MobileBrick_Mar23.zip"
url = "https://www.robots.ox.ac.uk/~victor/data/MobileBrick/MobileBrick_Mar23.zip"
bytes = 13_128_305_497
