[[dataset]]
name = "compas-cra"
group = "core"
license = "MIT"
source = "https://github.com/BlockResearchGroup/compas_cra"
citation = "Kao et al., Coupled Rigid-Block Analysis: Stability-Aware Design of Complex Discrete-Element Assemblies, ETH Zurich Block Research Group"
notes = """
The 22 sample discrete-element assemblies shipped with COMPAS CRA. The closest
published analogue of our LP formulation, from an independent group. Fetched as
raw JSON so no dependency is needed to read them (compas_cra itself pins
pyomo==6.4.2, which we will not put in this project's resolution).

It is the one non-brick source kept in the programme, because every LEGO dataset
here was labelled by the same solver family we implement — agreement with them
is consistency, not correctness. CRA is an independent formulation.

The stable/unstable shelf variants (shelf-stable vs shelf-s1/s2/s3) are the
independent verdict pairs; test_cra.py pins the force convention (a unit cube on
a unit interface puts 0.25 on each of four corners), which is directly
comparable to our per-contact forces.
"""

[[dataset.file]]
name = "samples/A.json"
url = "https://raw.githubusercontent.com/BlockResearchGroup/compas_cra/main/src/compas_cra/data/samples/A.json"
bytes = 3_826

