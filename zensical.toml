      { "optimize-lego-build" = "basics/skills/optimize-lego-build.md" },
      { "publish-lego-instructions" = "basics/skills/publish-lego-instructions.md" },
      { "analyze-lego-assembly" = "basics/skills/analyze-lego-assembly.md" },
