# Zensical configuration for the Legolization documentation site.
#
# Build:  uv run --group docs zensical build   (output in ./site)
# Serve:  uv run --group docs zensical serve
#
# The navigation below is explicit rather than inferred from the directory
# tree, so the reading order within each track is intentional. tests/test_docs.py
# validates that every entry resolves and that no page under docs/ is orphaned.

[project]

site_name = "Legolization"
site_description = """
Turn a 3D model into a physically buildable LEGO-style model in LDraw format, \
with verified structural stability, step-by-step build instructions, and a \
bill of materials.
"""
site_author = "Harold Martin"
site_url = "https://hbmartin.github.io/legolization/"

repo_url = "https://github.com/hbmartin/legolization"
repo_name = "hbmartin/legolization"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Harold Martin &mdash; GPL-3.0-or-later.
Legolization is an independent open-source project. It is not affiliated with,
sponsored by, or endorsed by the LEGO Group. LEGO&reg; is a trademark of the
LEGO Group, which does not authorize or endorse this project.
"""

