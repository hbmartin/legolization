[project]
name = "pyLDCad"
version = "0.1.0"
description = "Typed, extensible connectivity analysis for LDraw assemblies."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Harold Martin", email = "harold.martin@gmail.com" },
]
dependencies = [
    "pyldraw3>=1.5,<2",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "CPY001", "D105", "D107", "D203", "D212", "D213", "EM101", "PLR0911", "PLR2004", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN201", "D100", "D103", "S101"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]

[tool.uv.sources]
pyldraw3 = { git = "https://github.com/hbmartin/pyldraw3.git", rev = "f35d7dfce81b34032a095cfc7ff44bf0feba2735" }

[build-system]
requires = ["uv_build>=0.11.28,<0.13.0"]
build-backend = "uv_build"
