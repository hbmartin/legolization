[project]
name = "legolization"
version = "0.6.0"
description = "Python CLI for converting a 3D model to LDraw."
keywords = ["ldraw", "lego", "cad", "3d", "modeling", "parts", "bricks"]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "Harold Martin", email = "harold.martin@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Artistic Software",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "clarabel>=0.11.1",
    "cvxpy>=1.9.2",
    "highspy>=1.15.1",
    "jsonschema>=4.25.1",
    "numpy>=2.5.1",
    "osqp>=1.1.3",
    "filelock>=3.20.3",
    "platformdirs>=4.9.2",
    "pyldraw3>=1.6.1",
    "reportlab>=4.2",
    "scipy>=1.18.0",
    "scs>=3.2.11",
    "trimesh>=4.12.2",
]

[project.scripts]
legolization = "legolization.main:main"

[project.urls]
Homepage = "https://github.com/hbmartin/legolization"
Repository = "https://github.com/hbmartin/legolization"
Documentation = "https://hbmartin.github.io/legolization/"
Changelog = "https://github.com/hbmartin/legolization/releases"

[dependency-groups]
dev = [
    # bricknet: MIT, CVPR 2026. Used only by the external-dataset analyses for
    # an independent LDraw parser and its bundled connector-label tables; never
    # imported by src/ and never a runtime dependency.
    "bricknet>=0.1.0",
    "deptry>=0.23.0",
    "hypothesis>=6.156.7",
    "lizard>=1.23.0",
    "pillow>=12.1.0",
    # pyarrow: reads the StableText2Brick parquet in the dataset adapters.
    "pyarrow>=18.0.0",
    "pypdf>=5.1",
    "pyrefly>=1.1.1",
    "pyroma>=5.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]
docs = [
    "zensical>=0.0.50",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "datasets", "dist", "node_modules", "papers PDFs", "setup.py", "site-packages", "tools", "venv"]

line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D105", "D107", "D203", "D212", "D213", "EM101", "PLR2004", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ARG001", "ARG005", "D103", "D104", "DTZ003", "ERA001", "F403", "F405", "FBT002", "G004", "N802", "PLC0415", "PLR2004", "PLW1510", "PT011", "PT013", "PTH110", "PTH118", "PTH119", "PTH122", "PTH123", "PTH207", "S101", "S102", "S311", "S603", "S607", "SIM115"]
"scripts/**/*.py" = ["INP001", "T201"]

[tool.pytest.ini_options]
markers = [
    "slow: opt-in benchmark, sweep, and real-render tests; run with --run-slow",
]

[tool.ty.src]
exclude = ['papers\ PDFs', 'tools', 'datasets']

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
    "scripts/**/*.py",
]

[tool.uv.sources]
pyldraw3 = { git = "https://github.com/hbmartin/pyldraw3.git", rev = "465f783723ebd4f0a234b826b22b32f2c1d18b73" }

[tool.deptry]
known_first_party = ["legolization"]
extend_exclude = ["papers PDFs", "tools", "datasets"]
package_module_name_map = { pyldraw3 = ["ldraw"] }

[tool.deptry.per_rule_ignores]
# clarabel/highspy/osqp/scs are cvxpy/scipy solver backends loaded by name at
# runtime, never imported.
DEP002 = ["clarabel", "highspy", "osqp", "scs"]

[build-system]
requires = ["uv_build>=0.11.28,<0.13.0"]
build-backend = "uv_build"
